server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Audio files can be large (up to 60 minutes of recording).
  client_max_body_size 500m;

  # Send /api calls to the backend container, the same way Vite does in development.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
